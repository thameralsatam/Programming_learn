    <meta name="description" content="بيئة تفاعلية لتعلم لغة HTML مع معاينة مباشرة للكود." />
    <meta property="og:title" content="مختبر تعلم HTML" />
    <meta property="og:description" content="بيئة تفاعلية لتعلم لغة HTML مع معاينة مباشرة للكود." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Kufam:wght@300;400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@100;200;300;400;500;600&family=IBM+Plex+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;1,300;1,400&family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
    <script>
      (function() {
        function isIgnored(msg, err, target) {
          var s = (typeof msg === 'string' ? msg : '') + (err ? ' ' + (err.message || String(err)) : '');
          return (
            s.indexOf('ResizeObserver') !== -1 ||
            s.indexOf('Script error') !== -1 ||
            s.indexOf('[object Event]') !== -1 ||
            (typeof Event !== 'undefined' && (err instanceof Event || msg instanceof Event)) ||
            (typeof Worker !== 'undefined' && target instanceof Worker) ||
            !msg
          );
        }
        window.addEventListener('error', function(e) {
          if (isIgnored(e.message, e.error, e.target)) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          var reason = e.reason;
          if (isIgnored(reason && reason.message, reason)) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
        var prevOnError = window.onerror;
        window.onerror = function(msg, src, line, col, err) {
          if (isIgnored(msg, err)) {
            return true;
          }
          if (typeof prevOnError === 'function') {
            return prevOnError(msg, src, line, col, err);
          }
          return false;
        };
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
